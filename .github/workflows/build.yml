name: Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload main jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-main
          path: |
            build/libs/*.jar
            !build/libs/*-api.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar

      - name: Upload api jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-api
          path: build/libs/*-api.jar
          if-no-files-found: ignore

      - name: Upload dev jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-dev
          path: build/libs/*-dev.jar
          if-no-files-found: ignore

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-sources
          path: build/libs/*-sources.jar
          if-no-files-found: ignore