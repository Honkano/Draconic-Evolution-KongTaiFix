name: Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifacts (e.g. 1.5.33)'
        required: false
        default: '1.5.33'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set version variable
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.5.33" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload main jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-GTNH-${{ steps.ver.outputs.VERSION }}-[KongTaiFix]
          path: |
            build/libs/*.jar
            !build/libs/*-api.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar

      - name: Upload api jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-GTNH-${{ steps.ver.outputs.VERSION }}-api-[KongTaiFix]
          path: build/libs/*-api.jar
          if-no-files-found: ignore

      - name: Upload dev jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-GTNH-${{ steps.ver.outputs.VERSION }}-dev-[KongTaiFix]
          path: build/libs/*-dev.jar
          if-no-files-found: ignore

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: Draconic-Evolution-GTNH-${{ steps.ver.outputs.VERSION }}-sources-[KongTaiFix]
          path: build/libs/*-sources.jar
          if-no-files-found: ignore